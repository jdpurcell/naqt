name: Release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set Build Number
      run: echo "BUILD_NUMBER=$(date '+%Y-%m-%d').${GITHUB_SHA::7}" >> "$GITHUB_ENV"
    - name: Build
      env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: true
        DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
        DOTNET_GENERATE_ASPNET_CERTIFICATE: false
        DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true
      run: |
        dotnet publish naqt.csproj -c Release -p:UseAppHost=false -p:BuildNumber="$BUILD_NUMBER" -o Publish
    - name: Zip
      if: github.ref == 'refs/heads/main'
      uses: thedoctor0/zip-release@0.7.6
      with:
        directory: Publish
        filename: naqt.zip
    - name: Log Zip Hash
      if: github.ref == 'refs/heads/main'
      run: sha256sum Publish/naqt.zip
    - name: Upload Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ env.BUILD_NUMBER }}
        tag_name: v${{ env.BUILD_NUMBER }}
        target_commitish: ${{ github.sha }}
        body: Generated from [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
        make_latest: true
        files: Publish/naqt.zip
